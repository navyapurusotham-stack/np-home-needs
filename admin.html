<body>

<header>
  <h1>⚙️ NP Home Needs</h1>
  <div>Admin Panel</div>
</header>

<div class="container">

  <div id="message"></div>

  <div class="box">
    <h2>➕ Product Add / Edit</h2>

    <input type="hidden" id="productId">

    <label>Product Name</label>
    <input id="name" placeholder="ఉదా: టమాటా">

    <label>Category</label>
    <select id="category">
      <option value="Vegetables">🥦 Vegetables</option>
      <option value="Fruits">🍎 Fruits</option>
      <option value="Kirana">🛒 Kirana</option>
    </select>

    <label>Price ₹</label>
    <input id="price" type="number" placeholder="40">

    <label>Offer Price ₹</label>
    <input id="offer_price" type="number" placeholder="Optional">

    <label>Unit</label>
    <input id="unit" placeholder="ఉదా: 1 kg">

    <label>Stock</label>
    <input id="stock" type="number" value="10">

    <label>Product Image URL</label>
    <input id="image_url" placeholder="Image URL">

    <button class="save" onclick="saveProduct()">💾 Save Product</button>

    <button class="new" onclick="clearForm()">➕ New Product</button>
  </div>

  <div class="box">
    <h2>🛍️ Products</h2>
    <div id="products">Loading...</div>
  </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>
const SUPABASE_URL = "https://fpbmoddxkiykuhdxclmt.supabase.co";

const SUPABASE_KEY =
  "sb_publishable_rCkMVl4Nw1v3DfvedTHAqg_KpL0v1Jr";

const supabaseClient =
  window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);


function showMessage(text, success = true) {
  const box = document.getElementById("message");

  box.style.display = "block";
  box.textContent = text;

  box.style.background = success ? "#dcfce7" : "#fee2e2";
  box.style.color = success ? "#166534" : "#991b1b";

  setTimeout(() => {
    box.style.display = "none";
  }, 3000);
}


async function loadProducts() {

  const box = document.getElementById("products");

  box.innerHTML = "Loading...";

  const { data, error } = await supabaseClient
    .from("products")
    .select("*")
    .order("created_at", { ascending: false });

  if (error) {
    box.innerHTML = "❌ Products load కాలేదు: " + error.message;
    return;
  }

  if (!data || data.length === 0) {
    box.innerHTML = "Products ఏమీ లేవు.";
    return;
  }

  box.innerHTML = data.map(product => {

    const offer =
      product.offer_price &&
      Number(product.offer_price) < Number(product.price);

    return `
      <div class="product">

        <h3>${product.name}</h3>

        <div>
          Category: ${product.category || "-"}
        </div>

        <div>
          Price:
          <b>₹${product.price}</b>

          ${
            offer
              ? ` → <b>Offer ₹${product.offer_price}</b>`
              : ""
          }
        </div>

        <div>
          Stock: ${product.stock ?? 0}
        </div>

        <div style="margin-top:8px">

          ${
            product.active
              ? `<span class="status on">🟢 Active</span>`
              : `<span class="status off">🔴 Inactive</span>`
          }

        </div>

        <button
          class="edit"
          onclick='editProduct(${JSON.stringify(product)})'>
          ✏️ Edit
        </button>

        <button
          onclick="toggleProduct('${product.id}', ${product.active})">
          ${product.active ? "🔴 Hide" : "🟢 Show"}
        </button>

      </div>
    `;

  }).join("");
}


function editProduct(product) {

  document.getElementById("productId").value =
    product.id || "";

  document.getElementById("name").value =
    product.name || "";

  document.getElementById("category").value =
    product.category || "Kirana";

  document.getElementById("price").value =
    product.price || "";

  document.getElementById("offer_price").value =
    product.offer_price || "";

  document.getElementById("unit").value =
    product.unit || "";

  document.getElementById("stock").value =
    product.stock ?? 0;

  document.getElementById("image_url").value =
    product.image_url || "";

  window.scrollTo({
    top: 0,
    behavior: "smooth"
  });
}


function clearForm() {

  document.getElementById("productId").value = "";

  document.getElementById("name").value = "";
  document.getElementById("category").value = "Vegetables";
  document.getElementById("price").value = "";
  document.getElementById("offer_price").value = "";
  document.getElementById("unit").value = "";
  document.getElementById("stock").value = "10";
  document.getElementById("image_url").value = "";
}


async function saveProduct() {

  const id =
    document.getElementById("productId").value;

  const name =
    document.getElementById("name").value.trim();

  const category =
    document.getElementById("category").value;

  const price =
    Number(document.getElementById("price").value);

  const offerValue =
    document.getElementById("offer_price").value;

  const offer_price =
    offerValue === "" ? null : Number(offerValue);

  const unit =
    document.getElementById("unit").value.trim();

  const stock =
    Number(document.getElementById("stock").value);

  const image_url =
    document.getElementById("image_url").value.trim();


  if (!name || !price) {
    showMessage("Product name మరియు price ఇవ్వండి.", false);
    return;
  }


  const productData = {
    name,
    category,
    price,
    offer_price,
    stock,
    image_url,
    active: true
  };


  let result;


  if (id) {

    result = await supabaseClient
      .from("products")
      .update(productData)
      .eq("id", id);

  } else {

    result = await supabaseClient
      .from("products")
      .insert(productData);

  }


  if (result.error) {

    showMessage(
      "❌ Save కాలేదు: " + result.error.message,
      false
    );

    return;
  }


  showMessage(
    id
      ? "✅ Product update అయింది!"
      : "✅ New product add అయింది!"
  );


  clearForm();
  loadProducts();
}


async function toggleProduct(id, currentStatus) {

  const { error } =
    await supabaseClient
      .from("products")
      .update({
        active: !currentStatus
      })
      .eq("id", id);


  if (error) {

    showMessage(
      "❌ Status change కాలేదు: " + error.message,
      false
    );

    return;
  }


  showMessage(
    currentStatus
      ? "🔴 Product hidden"
      : "🟢 Product active"
  );


  loadProducts();
}


loadProducts();
</script>

</body>
</html>
